server:
  port: 8083

spring:
  application:
    name: hotel-booking-service

  datasource:
    url: ${HOTEL_DB_URL:jdbc:postgresql://localhost:5432/hotel_booking}
    username: ${HOTEL_DB_USER:hotel_svc}
    password: ${HOTEL_DB_PASSWORD:hotel_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # RabbitMQ - must point at the same broker the Notification Service consumes from.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Shared JWT signing secret - MUST match the Auth Service's secret exactly.
# For local dev this is a placeholder; get the real value from whoever owns Auth Service
# and put it in an environment variable instead of committing it here.
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-placeholder-secret-change-me-before-integrating-with-auth-service}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
