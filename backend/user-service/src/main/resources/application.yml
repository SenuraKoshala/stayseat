server:
  port: ${USER_SERVICE_PORT:8086}

spring:
  application:
    name: user-service

  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5437/user_db}
    username: ${USER_DB_USER:user_svc}
    password: ${USER_DB_PASSWORD:user_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # RabbitMQ - consumes UserRegistered from the same broker Auth publishes to.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-placeholder-secret-change-me-before-integrating-with-auth-service}
  upload:
    dir: ${USER_UPLOAD_DIR:uploads}
  public-base-url: ${USER_PUBLIC_BASE_URL:http://localhost:8086}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
