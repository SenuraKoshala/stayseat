server:
  port: 8084

spring:
  application:
    name: restaurant-booking-service

  datasource:
    url: jdbc:postgresql://localhost:5432/restaurant_booking
    username: restaurant_svc
    password: restaurant_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Shared JWT signing secret - MUST match the Auth Service's secret exactly.
# For local dev this is a placeholder; get the real value from whoever owns Auth Service
# and put it in an environment variable instead of committing it here.
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-placeholder-secret-change-me-before-integrating-with-auth-service}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
