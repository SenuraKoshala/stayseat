spring.application.name=notification-service

# Runs behind the API Gateway (which owns :8080). Override with SERVER_PORT if needed.
server.port=${SERVER_PORT:8082}



spring.datasource.url=${NOTIF_DB_URL:jdbc:postgresql://localhost:5435/notification_db}
spring.datasource.username=${NOTIF_DB_USER:postgres}
spring.datasource.password=${NOTIF_DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

####################################
# RabbitMQ
####################################

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest