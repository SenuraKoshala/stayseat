spring.application.name=authservice

# Server
server.port=8081

# Datasource (values come from .env via spring-dotenv)
spring.datasource.url=jdbc:postgresql://localhost:5433/${AUTH_DB_NAME}
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# springdoc (Swagger UI at /swagger-ui.html once you add the dependency)
springdoc.api-docs.path=/api-docs

spring.config.import=optional:file:.env[.properties]