spring.application.name=authservice

# Server
server.port=8081

# Datasource (values come from .env via spring-dotenv)
spring.datasource.url=jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5436}/${AUTH_DB_NAME:auth_db}
spring.datasource.username=${AUTH_DB_USER:auth_svc}
spring.datasource.password=${AUTH_DB_PASSWORD:auth_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
# Default MUST match the booking services' app.jwt.secret default so tokens issued
# here verify there out of the box. Override with a real JWT_SECRET before deploying.
jwt.secret=${JWT_SECRET:dev-only-placeholder-secret-change-me-before-integrating-with-auth-service}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# springdoc (Swagger UI at /swagger-ui.html once you add the dependency)
springdoc.api-docs.path=/api-docs

spring.config.import=optional:file:.env[.properties]